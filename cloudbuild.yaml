# Build → push → deploy @toolshare/web to Cloud Run in one `gcloud builds submit`.
#
# Usage (values live in apps/web/.env.local / root .env — both are PUBLIC keys):
#   gcloud builds submit --config cloudbuild.yaml \
#     --substitutions=_SUPABASE_URL=https://xxxx.supabase.co,_SUPABASE_ANON_KEY=eyJ...
#
# The two NEXT_PUBLIC values are needed at BUILD time (Next inlines them into the
# client bundle), which is why they're --build-arg here rather than runtime env.

steps:
  # 1. Build the image, injecting the public NEXT_PUBLIC_* values as build args.
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --build-arg=NEXT_PUBLIC_SUPABASE_URL=${_SUPABASE_URL}
      - --build-arg=NEXT_PUBLIC_SUPABASE_ANON_KEY=${_SUPABASE_ANON_KEY}
      - -t=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$BUILD_ID
      - -t=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:latest
      - .

  # 2. Push both tags.
  - name: gcr.io/cloud-builders/docker
    args: [push, --all-tags, '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}']

  # 3. Deploy to Cloud Run (scales to zero; free-tier friendly limits).
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$BUILD_ID
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --port=8080
      - --memory=512Mi
      - --cpu=1
      - --min-instances=0
      - --max-instances=3
      - --set-env-vars=NEXT_PUBLIC_SUPABASE_URL=${_SUPABASE_URL},NEXT_PUBLIC_SUPABASE_ANON_KEY=${_SUPABASE_ANON_KEY}

images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$BUILD_ID'

options:
  logging: CLOUD_LOGGING_ONLY
  # Default machine keeps builds inside Cloud Build's free tier. If a build is
  # too slow, uncomment for more power (NOTE: custom machines are billed, not free):
  # machineType: E2_HIGHCPU_8

substitutions:
  _REGION: us-central1
  _REPO: toolshare
  _SERVICE: toolshare-web
  _SUPABASE_URL: ''       # pass via --substitutions
  _SUPABASE_ANON_KEY: ''  # pass via --substitutions
