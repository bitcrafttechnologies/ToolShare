packages:
  - 'apps/*'
  - 'packages/*'

allowBuilds:
  esbuild: true
  sharp: false
  unrs-resolver: false

# react/react-dom are pinned to 19.1.0 (react-native 0.81 requires it).
#
# This pin used to live only in `package.json`'s `pnpm.overrides`, with a
# comment here warning NOT to duplicate it in this file because pnpm 9.x
# supposedly ignored `overrides` here. That flipped: as of ~2026-07-29, every
# `pnpm` invocation prints `The "pnpm" field in package.json is no longer
# read by pnpm ... "pnpm.overrides" ignored`, even though `pnpm --version`
# still answers 9.15.1 — so the package.json pin silently stopped applying
# and react-dom drifted back to 19.2.7 while react stayed 19.1.0, which is
# exactly the mismatch that makes Turbopack's `next dev` compile balloon to
# ~9GB and hang rather than error (see the CLAUDE.md-adjacent project notes).
# Pinning it here too costs nothing if some future pnpm reverses course
# again — an unrecognized/duplicate override is silently ignored, not an
# error — so both locations are kept rather than picking one and guessing.
overrides:
  react: 19.1.0
  react-dom: 19.1.0
