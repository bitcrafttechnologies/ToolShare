packages:
  - 'apps/*'
  - 'packages/*'

# react-native 0.81 pins react 19.1.0, but the web app's `react-dom: ^19`
# floated up to 19.2.7 — a react/react-dom version mismatch that crashes the
# jsdom test runtime. Pin both to 19.1.0 workspace-wide so every surface
# (web build, web tests, mobile) uses one matched pair.
overrides:
  react: 19.1.0
  react-dom: 19.1.0
